scheme: Pisces
darkmode: true

menu:
  home: / || fa fa-home
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags
  archives: /archives/ || fa fa-archive
  about: /about/ || fa fa-user
  rss: /atom.xml || fa fa-rss

avatar:
  url: https://avatars.githubusercontent.com/u/23132866

social:
  GitHub: https://github.com/jiabh || fab fa-github
